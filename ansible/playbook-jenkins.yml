---
- hosts: all
  become: true

  tasks:
    - name: Nettoyer la configuration de depot Jenkins
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/jenkins.list
        - /etc/apt/sources.list.d/jenkins.list.save

    - name: Importer la cle GPG Jenkins directement dans apt-key
      apt_key:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
        state: present

    - name: Ajouter le depot officiel Jenkins
      apt_repository:
        repo: "deb https://pkg.jenkins.io/debian-stable binary/"
        state: present
        filename: jenkins

    - name: Mettre a jour le cache apt
      apt:
        update_cache: yes

    - name: Installer Java 17 et Git
      apt:
        name:
          - openjdk-17-jdk
          - git
        state: present

    - name: Installer Jenkins
      apt:
        name: jenkins
        state: present

    - name: Demarrer et activer le service Jenkins
      service:
        name: jenkins
        state: started
        enabled: true
